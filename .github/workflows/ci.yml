name: Typecheck & Test

on:
  push:
  pull_request:

jobs:
  typecheck-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test
